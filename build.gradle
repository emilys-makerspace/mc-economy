plugins {
    id 'java-library'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'ca.emilybelnavis.mcmods.economy'
version = '0.4.0-alpha'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
repositories { mavenCentral() }
neoForge {
    version = '21.1.252'
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client(); gameDirectory = file(providers.gradleProperty('economyRunRoot').getOrElse('run') + '/client') }
        server { server(); gameDirectory = file(providers.gradleProperty('economyRunRoot').getOrElse('run') + '/server'); programArgument '--nogui' }
    }
    mods { economy { sourceSet sourceSets.main } }
    // Command permission tests exercise the real Minecraft command source and dispatcher.
    addModdingDependenciesTo(sourceSets.test)
}
dependencies {
    implementation('org.xerial:sqlite-jdbc:3.53.4.0') { transitive = false }
    jarJar('org.xerial:sqlite-jdbc:3.53.4.0') {
        transitive = false
        version { strictly '[3.53.4.0]'; prefer '3.53.4.0' }
    }
    additionalRuntimeClasspath('org.xerial:sqlite-jdbc:3.53.4.0') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
configurations {
    processProbeRuntime {
        canBeConsumed = false
        extendsFrom implementation
    }
}
// Branch placement recovery decodes detached JSON even in offline storage tools.
dependencies { processProbeRuntime 'com.google.code.gson:gson:2.10.1' }
test {
    useJUnitPlatform()
    reports.junitXml.required = true
    // Measure the mod; instrumenting Minecraft's large static initializers can exceed JVM limits.
    jacoco { includes = ['ca.emilybelnavis.mcmods.economy.*'] }
    finalizedBy jacocoTestReport
    // Standalone storage probes use stdout as a protocol and do not load Minecraft.
    systemProperty 'economy.test.classpath',
            files(sourceSets.test.output, sourceSets.main.output, configurations.processProbeRuntime).asPath
}
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
jacoco { toolVersion = '0.8.14' }
// Forward the development console so the server can be stopped with its `stop` command.
tasks.named('runServer', JavaExec) { standardInput = System.in }

// Run only against a stopped world; this task never starts Minecraft.
tasks.register('prepareEconomyUpgrade', JavaExec) {
    group = 'economy maintenance'
    description = 'Prepare a validated offline complete-world backup before a schema upgrade.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ca.emilybelnavis.mcmods.economy.storage.UpgradeBackup'
    if (providers.gradleProperty('economyWorld').isPresent()) {
        args providers.gradleProperty('economyWorld').get()
    }
}

tasks.register('backupEconomyWorld', JavaExec) {
    group = 'economy maintenance'
    description = 'Back up a cleanly stopped complete world.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ca.emilybelnavis.mcmods.economy.storage.WorldBackup'
    if (providers.gradleProperty('economyWorld').isPresent()) args 'backup', providers.gradleProperty('economyWorld').get()
}
tasks.register('restoreEconomyWorld', JavaExec) {
    group = 'economy maintenance'
    description = 'Validate and restore a complete backup into a new separate destination.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ca.emilybelnavis.mcmods.economy.storage.WorldBackup'
    if (providers.gradleProperty('economyBackup').isPresent() && providers.gradleProperty('economyRestoreDestination').isPresent()) {
        args 'restore', providers.gradleProperty('economyBackup').get(), providers.gradleProperty('economyRestoreDestination').get()
    }
}

// Opt-in disposable Minecraft inventory persistence fixture, excluded from release jars.
sourceSets {
    inventoryProbe {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.inventoryProbeImplementation.extendsFrom(configurations.implementation)
neoForge {
    addModdingDependenciesTo(sourceSets.inventoryProbe)
    if (providers.gradleProperty('custodyInventoryProbe').isPresent()) {
        mods { economy_inventory_probe { sourceSet sourceSets.inventoryProbe } }
    }
}
if (providers.gradleProperty('custodyInventoryProbe').isPresent()) {
    def probeWorld = file(providers.gradleProperty('economyRunRoot').get() + '/server/world')
    def restartProbe = new File(probeWorld, 'inventory-probe.properties').exists()
    tasks.named('runServer') {
        doLast {
            def failure = new File(probeWorld, 'inventory-probe-failed.txt')
            def success = new File(probeWorld, restartProbe ? 'inventory-probe-passed.txt' : 'inventory-probe.properties')
            if (!providers.gradleProperty('terminalGeometryProbe').isPresent() && !providers.gradleProperty('bankingProbe').isPresent() && !providers.gradleProperty('bankingRecovery').isPresent() && !providers.gradleProperty('collectionProbe').isPresent() && !providers.gradleProperty('financeProbe').isPresent() && !providers.gradleProperty('branchReleaseProbe').isPresent() && !providers.gradleProperty('collectionBankingProbe').isPresent() && (failure.exists() || !success.exists())) {
                throw new GradleException('Minecraft custody inventory persistence fixture did not pass')
            }
        }
    }
}

// Opt-in physical terminal acceptance; uses the same release-excluded fixture mod.
if (providers.gradleProperty('terminalGeometryProbe').isPresent()) {
    tasks.named('runServer') {
        systemProperty 'economy.terminalGeometryProbe', 'true'
        doLast {
            def root = file(providers.gradleProperty('economyRunRoot').get() + '/server/world')
            if (new File(root, 'terminal-probe-failed.txt').exists() || !new File(root, 'terminal-probe-passed.txt').exists())
                throw new GradleException('Physical terminal fixture did not pass')
        }
    }
}

if (providers.gradleProperty('bankingProbe').isPresent()) {
    tasks.named('runServer') {
        systemProperty 'economy.bankingProbe', 'true'
        doLast {
            def root = file(providers.gradleProperty('economyRunRoot').get() + '/server/world')
            if (!providers.gradleProperty('bankingCrash').isPresent() && (new File(root, 'banking-probe-failed.txt').exists() || !new File(root, 'banking-probe-passed.txt').exists()))
                throw new GradleException('Normal banking menu acceptance did not pass')
        }
    }
    tasks.named('runClient') { systemProperty 'economy.bankingProbe', 'true' }
}
if (providers.gradleProperty('bankingWorld').isPresent()) {
    tasks.named('runClient') { systemProperty 'economy.bankingWorld', providers.gradleProperty('bankingWorld').get() }
}

if (providers.gradleProperty('bankingCrash').isPresent()) {
    tasks.named('runServer') {
        systemProperty 'economy.bankingCrash', providers.gradleProperty('bankingCrash').get()
        ignoreExitValue = true
        doLast {
            def capture = file(providers.gradleProperty('economyRunRoot').get() + '/server/world/banking-crash-capture.dat')
            if (executionResult.get().exitValue != 77 || !capture.exists())
                throw new GradleException('Expected disposable banking process death was not observed')
        }
    }
}
if (providers.gradleProperty('bankingRecovery').isPresent()) {
    tasks.named('runServer') {
        systemProperty 'economy.bankingRecovery', 'true'
        doLast {
            def root = file(providers.gradleProperty('economyRunRoot').get() + '/server/world')
            if (new File(root, 'banking-recovery-failed.txt').exists() || !new File(root, 'banking-recovery-passed.txt').exists())
                throw new GradleException('Banking crash/restore recovery did not pass')
        }
    }
}

// Opt-in Collection Agent acceptance in a disposable development world.
if (providers.gradleProperty('collectionProbe').isPresent()) {
    def collectionRoot=file(providers.gradleProperty('economyRunRoot').get()+'/server/world')
    def collectionRestart=new File(collectionRoot,'collection-probe-passed.txt').exists()
    tasks.named('runServer') {
        systemProperty 'economy.collectionProbe', 'true'
        doLast {
            def passed=new File(collectionRoot,collectionRestart?'collection-probe-restart-passed.txt':'collection-probe-passed.txt')
            if(new File(collectionRoot,'collection-probe-failed.txt').exists()||!passed.exists())
                throw new GradleException('Collection Agent acceptance did not pass')
        }
    }
}

// Opt-in finance menu acceptance in a disposable development world.
if (providers.gradleProperty('financeProbe').isPresent()) {
