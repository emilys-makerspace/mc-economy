            if (new File(root, 'collection-probe-failed.txt').exists() || !new File(root, 'collection-banking-passed.txt').exists())
                throw new GradleException('Remote collection banking acceptance did not pass')
        }
    }
}
if (providers.gradleProperty('financeWorld').isPresent()) {
    tasks.named('runClient') {
        systemProperty 'economy.financeWorld', providers.gradleProperty('financeWorld').get()
        doLast {
            def root = file(providers.gradleProperty('economyRunRoot').get() + '/client/saves/' + providers.gradleProperty('financeWorld').get())
            if (new File(root, 'finance-client-failed.txt').exists() || !new File(root, 'finance-client-passed.txt').exists())
                throw new GradleException('Integrated finance client acceptance did not pass')
        }
    }
}

