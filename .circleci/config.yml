version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  test:
    # The complete JUnit suite is split across four fixed workers.
    parallelism: 4
    resource_class: large
    docker:
      - image: cimg/openjdk:21.0
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - checkout
      - run:
          name: Prepare test and coverage directories
          command: mkdir -p build/circleci/junit build/circleci/batches coverage
      - run:
          name: Run the complete JUnit suite with static four-way splitting
          when: always
          command: |
            if bash .circleci/run-full-tests.sh; then result=0; else result=$?; fi
            printf '%s\n' "$result" > build/circleci/junit.status
      - run:
          name: Preserve this node's JUnit execution data
          when: always
          command: |
            node_dir="coverage/node-${CIRCLE_NODE_INDEX}"
            mkdir -p "$node_dir"
            find build/circleci/batches -name '*.exec' -type f -print0 |
              while IFS= read -r -d '' source; do
                destination="$node_dir/${source#build/circleci/}"
                mkdir -p "$(dirname "$destination")"
                cp "$source" "$destination"
              done
            if [[ -f build/circleci/all-tests.txt ]]; then cp build/circleci/all-tests.txt "$node_dir/all-tests.txt"; fi
            if [[ -f build/circleci/node-tests.txt ]]; then cp build/circleci/node-tests.txt "$node_dir/selected-tests.txt"; fi
            mkdir -p "$node_dir/junit"
            find build/circleci/junit -name '*.xml' -type f -exec cp {} "$node_dir/junit/" \;
            cp build/circleci/junit.status "$node_dir/"
            printf '%s\n' "$CIRCLE_NODE_INDEX" > "$node_dir/node.txt"
      - persist_to_workspace:
          root: .
          paths:
            - coverage
      - store_test_results:
          path: build/circleci/junit
      - store_artifacts:
          path: build/circleci/junit
      - store_artifacts:
          path: build/circleci/all-tests.txt
      - store_artifacts:
          path: build/circleci/node-tests.txt
      - store_artifacts:
          path: build/circleci/batches
      - run:
          name: Fail the node if JUnit failed
          when: always
          command: |
            if [[ ! -f build/circleci/junit.status ]] || [[ "$(cat build/circleci/junit.status)" != 0 ]]; then
              echo "JUnit failed or did not complete; see the saved reports and logs." >&2
              exit 1
            fi
  aggregate-coverage:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Aggregate coverage from all JUnit shards
          command: |
            # Still produce diagnostic HTML when inputs are incomplete, but never publish it as full coverage.
            set +e
            python3 .circleci/verify-coverage-inputs.py coverage
            inputs_status=$?
            ./gradlew jacocoTestReport -x test -I .circleci/gradle-tests.init.gradle -PcircleciAggregateDir=coverage
            report_status=$?
            if (( inputs_status != 0 || report_status != 0 )); then exit 1; fi
      - store_artifacts:
          path: build/reports/jacoco/test/html
      - store_artifacts:
          path: build/reports/jacoco/test/jacocoTestReport.xml
      - codecov/upload:
          files: build/reports/jacoco/test/jacocoTestReport.xml
      - run:
          name: Upload JaCoCo coverage to Codacy
          command: |
            if [[ -z "${CODACY_PROJECT_TOKEN:-}" ]]; then
              echo "Skipping Codacy coverage upload because CODACY_PROJECT_TOKEN is unavailable."
              exit 0
            fi
            curl --fail --silent --show-error --location https://coverage.codacy.com/get.sh |
              bash -s -- report -r build/reports/jacoco/test/jacocoTestReport.xml --commit-uuid "$CIRCLE_SHA1"
  code-scanning:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Run SonarQube analysis
          command: |
            ./gradlew build sonarqube -x test
workflows:
  test:
    jobs:
      - test
      - aggregate-coverage:
          requires:
            - test:
                - success
                - failed
      - code-scanning:
          context: sonarqube
          requires:
            - test:
                - success
                - failed
