version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  list-tests:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Select tests for dynamic parallelism
          command: circleci testsuite list-tests "economy tests" --key=economy-tests
  test:
    parallelism: 4
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
            - gradle-v1-
      - run:
          name: Compile tests before requesting dynamic batches
          command: ./gradlew testClasses
      - run:
          name: Run dynamically distributed test batches
          command: circleci testsuite run "economy tests"
      - run:
          name: Combine coverage from this node's batches
          when: always
          command: ./gradlew jacocoTestReport -x test -I .circleci/gradle-tests.init.gradle
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
      - store_test_results:
          path: build/circleci/junit
      - store_artifacts:
          path: build/circleci/junit
      - store_artifacts:
          path: build/circleci/batches
      - store_artifacts:
          path: build/reports/jacoco/test/html
      - codecov/upload:
          files: build/reports/jacoco/test/jacocoTestReport.xml

workflows:
  test:
    # Main builds refresh impact data; PR builds select impacted tests.
    when: pipeline.git.branch == "main" or pipeline.event.name == "api" or (pipeline.event.name == "pull_request" and (pipeline.event.action == "opened" or pipeline.event.action == "synchronize" or pipeline.event.action == "reopened"))
    jobs:
      - list-tests
      - test:
          requires:
            - list-tests

# Experimental CircleCI syntax: keep the existing two-node ceiling/fallback.
experimental:
  dynamic-parallelism:
    test:
      key: economy-tests
      min: 1
      max: 4
