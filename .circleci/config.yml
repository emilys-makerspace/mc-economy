version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
            - gradle-v1-
      - run:
          name: Run tests and create coverage report
          command: ./gradlew test jacocoTestReport --no-daemon
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
      - store_test_results:
          path: build/test-results/test
      - store_artifacts:
          path: build/reports/tests/test
      - store_artifacts:
          path: build/reports/jacoco/test/html
      - codecov/upload:
          files: build/reports/jacoco/test/jacocoTestReport.xml

workflows:
  test:
    when: pipeline.event.name == "api" or (pipeline.event.name == "pull_request" and (pipeline.event.action == "opened" or pipeline.event.action == "synchronize" or pipeline.event.action == "reopened"))
    jobs:
      - test
