version: 2.1

# A10-04 external-client testing is manual and excluded from CircleCI.
# It is not a prerequisite for CI pass/fail or coverage aggregation.

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  test:
    # Four fixed workers: static JUnit class shards and one distinct live-client scenario each.
    parallelism: 4
    resource_class: large
    docker:
      - image: cimg/openjdk:21.0
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
            - gradle-v1-
      - run:
          name: Prepare test and coverage directories
          command: mkdir -p build/circleci/junit build/circleci/batches build/circleci/live coverage
      - run:
          name: Install the virtual display and software OpenGL runtime
          command: |
            # Defer failure until after evidence is persisted; the final gate checks every status.
            set +e
            (
            set -eo pipefail
            sudo apt-get update
            if apt-cache show libasound2t64 >/dev/null 2>&1; then audio_package=libasound2t64; else audio_package=libasound2; fi
            sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1 "$audio_package" libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1
            xvfb-run -a -s '-screen 0 1280x1024x24 -nolisten tcp' glxinfo -B
            )
            result=$?
            printf '%s\n' "$result" > build/circleci/setup.status
      - run:
          name: Run the complete JUnit suite with static four-way splitting
          when: always
          command: |
            if bash .circleci/run-full-tests.sh; then result=0; else result=$?; fi
            printf '%s\n' "$result" > build/circleci/junit.status
      - run:
          name: Run this node's real Minecraft menu or inventory scenario
          when: always
          no_output_timeout: 20m
          command: |
            if python3 .circleci/run-live-probe.py; then result=0; else result=$?; fi
            printf '%s\n' "$result" > build/circleci/live.status
      - run:
          name: Preserve this node's JUnit and live-client execution data
          when: always
          command: |
            node_dir="coverage/node-${CIRCLE_NODE_INDEX}"
            mkdir -p "$node_dir"
            find build/circleci/batches build/circleci/live -name '*.exec' -type f -print0 |
              while IFS= read -r -d '' source; do
                destination="$node_dir/${source#build/circleci/}"
                mkdir -p "$(dirname "$destination")"
                cp "$source" "$destination"
              done
            if [[ -f build/circleci/all-tests.txt ]]; then cp build/circleci/all-tests.txt "$node_dir/all-tests.txt"; fi
            if [[ -f build/circleci/node-tests.txt ]]; then cp build/circleci/node-tests.txt "$node_dir/selected-tests.txt"; fi
            mkdir -p "$node_dir/junit"
            find build/circleci/junit -name '*.xml' -type f -exec cp {} "$node_dir/junit/" \;
            cp build/circleci/*.status "$node_dir/"
            printf '%s\n' "$CIRCLE_NODE_INDEX" > "$node_dir/node.txt"
      - persist_to_workspace:
          root: .
          paths:
            - coverage
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
      - store_test_results:
          path: build/circleci/junit
      - store_artifacts:
          path: build/circleci/junit
      - store_artifacts:
          path: build/circleci/all-tests.txt
      - store_artifacts:
          path: build/circleci/node-tests.txt
      - store_artifacts:
          path: build/circleci/batches
      - store_artifacts:
          path: build/circleci/live
      - run:
          name: Fail the node if setup, JUnit, or its live scenario failed
          when: always
          command: |
            for phase in setup junit live; do
              status_file="build/circleci/${phase}.status"
              if [[ ! -f "$status_file" ]] || [[ "$(cat "$status_file")" != 0 ]]; then
                echo "$phase failed or did not complete; see the saved reports and logs." >&2
                exit 1
              fi
            done
  aggregate-coverage:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
            - gradle-v1-
      - run:
          name: Aggregate coverage from all JUnit shards and live clients
          command: |
            # Still produce diagnostic HTML when inputs are incomplete, but never publish it as full coverage.
            set +e
            python3 .circleci/verify-coverage-inputs.py coverage
            inputs_status=$?
            ./gradlew jacocoTestReport -x test -I .circleci/gradle-tests.init.gradle -PcircleciAggregateDir=coverage
            report_status=$?
            if (( inputs_status != 0 || report_status != 0 )); then exit 1; fi
      - store_artifacts:
          path: build/reports/jacoco/test/html
      - store_artifacts:
          path: build/reports/jacoco/test/jacocoTestReport.xml
      - codecov/upload:
          files: build/reports/jacoco/test/jacocoTestReport.xml

workflows:
  test:
    jobs:
      - test
      - aggregate-coverage:
          requires:
            - test:
                - success
                - failed
