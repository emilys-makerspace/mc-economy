name: economy tests
discover: >-
  find src/test/java -type f -name '*Test.java' |
  sed 's#^src/test/java/##; s#/#.#g; s#\.java$##' |
  sort
run: bash .circleci/run-test-batch.sh "<< outputs.junit-directory >>" << test.atoms >>
analysis: bash .circleci/analyze-test.sh "<< outputs.lcov >>" << test.atoms >>
file-mapper: python3 .circleci/impact-data.py map << test.atoms >> > "<< outputs.circleci-list >>"
outputs:
  junit-directory: build/circleci/junit
options:
  dynamic-test-splitting: true
  test-impact-analysis: true
  max-auto-rerun: 1
  # Coverage does not capture resources, build configuration or shared fixtures.
  full-test-run-paths:
    - build.gradle
    - settings.gradle
    - gradle.properties
    - gradle/**
    - gradlew
    - .circleci/**
    - src/main/resources/**
    - src/test/**
  # Subprocess JVMs are intentionally outside the parent's coverage agent.
  test-selection-rules:
    - test-atom: ca.emilybelnavis.mcmods.economy.recovery.RecoveryProcessTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.recovery.CalendarProcessTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.storage.SqliteStorageTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.credit.CreditRecoveryTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.loan.DebtProcessTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.loan.LoanRecoveryTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.journal.JournalProcessTest
      include: true
    - test-atom: ca.emilybelnavis.mcmods.economy.journal.CustodyProcessTest
      include: true
